name: Deploy Review App
on:
  # Deploy, or update, the review app whenever the PR's code changes.
  pull_request:
    types: [opened, reopened, synchronize]
  # Tear it down on close. This has to be pull_request_target: GitHub creates
  # no `pull_request` run at all for a PR it can't test-merge (merge conflict,
  # or head force-pushed onto base), so `closed` never fired for those PRs and
  # their apps ran forever (10 leaked, destroyed by hand 2026-10-17).
  # pull_request_target runs this file from the base branch, so it fires on
  # every close. It runs with secrets, so the cleanup job never checks out or
  # executes PR code.
  pull_request_target:
    types: [closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Set these to your Fly.io organization and preferred region.
  FLY_REGION: ewr
  FLY_ORG: coreyja-studio

jobs:
  review_app:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref || github.ref_name, 'update-screenshot-') }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Only run one deployment at a time per PR.
    concurrency:
      group: pr-${{ github.event.number }}

    # Deploying apps with this "review" environment allows the URL for the app to be displayed in the PR UI.
    # Feel free to change the name of this environment.
    environment:
      name: review
      # The script in the `deploy` sets the URL output for each review app.
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Debug
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.head_ref: ${{ github.head_ref }}"
      - name: Get code
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v8

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v4
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          database: coreyja
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch-name.outputs.current_branch }}
          username: coreyja
          api_key: ${{ secrets.NEON_API_KEY }}

      # superfly/fly-pr-review-apps can't pass Docker build secrets, which
      # font-awesome-embed needs at compile time — so drive flyctl directly.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy PR app to Fly.io
        id: deploy
        env:
          FONT_AWESOME_TOKEN: ${{ secrets.FONT_AWESOME_TOKEN }}
        run: |
          app="coreyja-com-pr-${{ github.event.number }}"
          if ! flyctl status --app "$app" > /dev/null 2>&1; then
            flyctl apps create "$app" --org "$FLY_ORG"
          fi
          # --stage: applied by the deploy below; errors if values are unchanged, hence || true
          flyctl secrets set --app "$app" --stage \
            APP_BASE_URL="https://$app.fly.dev" \
            DATABASE_URL="${{ steps.create-branch.outputs.db_url }}?sslmode=require" \
            TWITCH_CLIENT_ID="FAKE" TWITCH_CLIENT_SECRET="FAKE" TWITCH_BOT_ACCESS_TOKEN="FAKE" \
            TWITCH_BOT_USER_ID="FAKE" TWITCH_CHANNEL_USER_ID="FAKE" GITHUB_APP_ID="123" \
            GITHUB_APP_CLIENT_ID="FAKE" GITHUB_APP_CLIENT_SECRET="FAKE" GITHUB_APP_PRIVATE_KEY="FAKE" \
            GITHUB_PERSONAL_ACCESS_TOKEN="FAKE" OPEN_AI_API_KEY="FAKE" GOOGLE_CLIENT_ID="FAKE" \
            GOOGLE_CLIENT_SECRET="FAKE" ENCRYPTION_SECRET_KEY="FAKE" JOBS_DISABLED="true" \
            CRON_DISABLED="true" DISCORD_TOKEN="FAKE" DISCORD_BOT_DISABLED="true" \
            ANTHROPIC_API_KEY="FAKE" LINEAR_CLIENT_ID="FAKE" LINEAR_CLIENT_SECRET="FAKE" \
            LINEAR_WEBHOOK_SECRET="FAKE" || true
          # fly.review.toml, not prod's fly.toml: a small VM that stops when idle.
          # VM size lives in [[vm]] there; a --vm-memory flag here did not
          # resize existing machines (pr-398 stayed at 4GB after #414).
          flyctl deploy --config fly.review.toml --app "$app" --regions "$FLY_REGION" \
            --remote-only --strategy immediate \
            --build-secret FONT_AWESOME_TOKEN="$FONT_AWESOME_TOKEN" \
            --ha=false
          echo "url=https://$app.fly.dev" >> "$GITHUB_OUTPUT"

  cleanup:
    # Same-repo PRs only: fork PRs never get a review app (no secrets on their
    # pull_request runs), and a fork's branch name must not reach a shell that
    # holds secrets (delete-branch-action interpolates it into a script).
    if: >-
      ${{ github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'update-screenshot-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Shares the deploy job's group, so a close waits for an in-flight deploy
    # instead of racing it (a deploy finishing after the destroy would
    # recreate the app).
    concurrency:
      group: pr-${{ github.event.number }}
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Fails the job if the destroy fails. Only "no such app" (the PR never
      # got a successful deploy) is treated as success, and that's decided
      # from the app list, not by swallowing errors with `|| true`.
      - name: Destroy PR app
        env:
          APP: coreyja-com-pr-${{ github.event.number }}
        run: |
          apps="$(flyctl apps list --json)"
          if jq -e --arg app "$APP" 'any(.[]; .Name == $app)' <<< "$apps" > /dev/null; then
            flyctl apps destroy "$APP" -y
          else
            echo "No Fly app named $APP; nothing to destroy."
          fi

      # Runs even if the destroy failed. A failure here (e.g. the branch is
      # already gone) is reported but doesn't fail the job: the Fly app is
      # what costs money. head_ref matches tj-actions/branch-names'
      # current_branch on PR events, which the create step used.
      - name: Delete Neon Branch
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
