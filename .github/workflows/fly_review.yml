name: Deploy Review App
on:
  # Run this workflow on every PR event. Existing review apps will be updated when the PR is updated.
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Set these to your Fly.io organization and preferred region.
  FLY_REGION: ewr
  FLY_ORG: personal

jobs:
  review_app:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'update-screenshot-') }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Only run one deployment at a time per PR.
    concurrency:
      group: pr-${{ github.event.number }}

    # Deploying apps with this "review" environment allows the URL for the app to be displayed in the PR UI.
    # Feel free to change the name of this environment.
    environment:
      name: review
      # The script in the `deploy` sets the URL output for each review app.
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Debug
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.head_ref: ${{ github.head_ref }}"
      - name: Get code
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v8

      - name: Create Neon Branch
        id: create-branch
        if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@v4
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          database: coreyja
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch-name.outputs.current_branch }}
          username: coreyja
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Delete Neon Branch
        id: delete-branch
        if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ steps.branch-name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # superfly/fly-pr-review-apps can't pass Docker build secrets, which
      # font-awesome-embed needs at compile time — so drive flyctl directly.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy PR app
        if: github.event.action == 'closed'
        run: flyctl apps destroy "coreyja-com-pr-${{ github.event.number }}" -y || true

      - name: Deploy PR app to Fly.io
        id: deploy
        if: github.event.action != 'closed'
        env:
          FONT_AWESOME_TOKEN: ${{ secrets.FONT_AWESOME_TOKEN }}
        run: |
          app="coreyja-com-pr-${{ github.event.number }}"
          if ! flyctl status --app "$app" > /dev/null 2>&1; then
            flyctl apps create "$app" --org "$FLY_ORG"
          fi
          # --stage: applied by the deploy below; errors if values are unchanged, hence || true
          flyctl secrets set --app "$app" --stage \
            APP_BASE_URL="https://$app.fly.dev" \
            DATABASE_URL="${{ steps.create-branch.outputs.db_url }}?sslmode=require" \
            TWITCH_CLIENT_ID="FAKE" TWITCH_CLIENT_SECRET="FAKE" TWITCH_BOT_ACCESS_TOKEN="FAKE" \
            TWITCH_BOT_USER_ID="FAKE" TWITCH_CHANNEL_USER_ID="FAKE" GITHUB_APP_ID="123" \
            GITHUB_APP_CLIENT_ID="FAKE" GITHUB_APP_CLIENT_SECRET="FAKE" GITHUB_APP_PRIVATE_KEY="FAKE" \
            GITHUB_PERSONAL_ACCESS_TOKEN="FAKE" OPEN_AI_API_KEY="FAKE" GOOGLE_CLIENT_ID="FAKE" \
            GOOGLE_CLIENT_SECRET="FAKE" ENCRYPTION_SECRET_KEY="FAKE" JOBS_DISABLED="true" \
            CRON_DISABLED="true" DISCORD_TOKEN="FAKE" DISCORD_BOT_DISABLED="true" \
            ANTHROPIC_API_KEY="FAKE" LINEAR_CLIENT_ID="FAKE" LINEAR_CLIENT_SECRET="FAKE" \
            LINEAR_WEBHOOK_SECRET="FAKE" || true
          flyctl deploy --app "$app" --regions "$FLY_REGION" --remote-only --strategy immediate \
            --build-secret FONT_AWESOME_TOKEN="$FONT_AWESOME_TOKEN" \
            --ha=false --vm-memory 512
          echo "url=https://$app.fly.dev" >> "$GITHUB_OUTPUT"
